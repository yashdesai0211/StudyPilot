name: Build StudyPilot Android APK Only

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Android web assets
        run: python scripts/prepare-android-assets.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p Android --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp Android/app/build/outputs/apk/debug/app-debug.apk output/StudyPilot-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPilot-Android-APK
          path: output/StudyPilot-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/StudyPilot-Android.apk
          generate_release_notes: true
