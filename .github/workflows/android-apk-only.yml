name: Build StudyPilot Android APK Only

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Android assets
        run: python scripts/prepare-android-assets.py

      - name: Build APK
        run: |
          ./gradle-8.9/bin/gradle \
            -p Android \
            --no-daemon \
            :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp Android/app/build/outputs/apk/debug/app-debug.apk \
            output/StudyPilot-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyPilot-Android-APK
          path: output/StudyPilot-Android.apk
          if-no-files-found: error
          retention-days: 30
